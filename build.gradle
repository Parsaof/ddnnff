plugins {
    id "java"
    id "eclipse"
    id "idea"
    id "net.minecraftforge.gradle" version "5.1.+"
}

group = "de.waterdu.aquaskills"
version = "3.1.1"

base {
    archivesName = "AquaSkills-1.12.2-pixelmon"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    maven { url = "https://maven.minecraftforge.net" }
    mavenCentral()
    flatDir { dirs "libs" }   // Jars locaux (Pixelmon, AquaAPI, etc.)
}

minecraft {
    // Mappings stables 1.12.2
    mappings channel: "snapshot", version: "20171003-1.12"

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            mods { aquaskills { source sourceSets.main } }
        }
        server {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            mods { aquaskills { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"

    // --- Pixelmon (choisis UNE option et commente l'autre) ---
    // OPTION A : API dev locale posée dans libs/
    // compileOnly name: "Pixelmon-API-8.4.3"

    // OPTION B : Universal locale (déobfusquée à la volée)
    // implementation fg.deobf(files("libs/Pixelmon-1.12.2-8.4.3-universal.jar"))

    // --- AquaAPI (si tu l'utilises) ---
    // implementation files("libs/AquaAPI-1.12.2.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    // Remplace ${version}/${mcversion} dans mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": "1.12.2"
    }
    // Copie le reste tel quel
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

jar {
    from sourceSets.main.output
    manifest {
        attributes("ModSide": "BOTH")
    }
}

// Génère le jar re-obfusqué utilisable côté serveur
tasks.named("jar").configure { finalizedBy("reobfJar") }
