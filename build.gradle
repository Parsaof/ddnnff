plugins {
    id "java"
    id "eclipse"
    id "idea"
    id "net.minecraftforge.gradle" version "5.1.+"
}

group = "de.waterdu.aquaskills"
version = "3.1.1"
base.archivesName = "AquaSkills-1.12.2-pixelmon"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    maven { url = "https://maven.minecraftforge.net" }
    mavenCentral()
    flatDir { dirs "libs" }   // tes jars locaux (Pixelmon, etc.)
}

minecraft {
    // mappings stables pour 1.12.2
    mappings channel: "snapshot", version: "20171003-1.12"

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            mods { aquaskills { source sourceSets.main } }
        }
        server {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            mods { aquaskills { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"

    // === Pixelmon (choisis UNE des 2 lignes suivantes) ===
    // OPTION A : API dev locale
    // compileOnly name: "Pixelmon-API-8.4.3"

    // OPTION B : universal locale (déobfusquée à la volée)
    // implementation fg.deobf(files("libs/Pixelmon-1.12.2-8.4.3-universal.jar"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// S'assure que mcmod.info est copié et que les variables ${version} sont remplacées
processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": "1.12.2"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

// Génère le JAR reobfusqué attendu par un serveur 1.12.2
jar.finalizedBy("reobfJar")


jar {
    // Optionnel : si ton mod est pure serveur, tu peux documenter ça ici
    manifest { attributes("ModSide": "SERVER") }
}
jar.finalizedBy("reobfJar")

jar {
    manifest {
        attributes(
                "ModSide": "BOTH"
        )
    }
}

jar.finalizedBy("reobfJar")
